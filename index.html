<!DOCTYPE html>
<html>
<head>
<title>For My Love ❤️</title>

<style>

body{
margin:0;
padding:0;
background:black;
font-family:Arial;
overflow:hidden;
color:white;
text-align:center;
}

.bg{
position:fixed;
width:100%;
height:100%;
background:url('https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200') center/cover;
filter:blur(4px);
z-index:-1;
}

.content{
margin-top:80px;
padding:20px;
}

h1{
font-size:50px;
animation:glow 2s infinite alternate;
}

p{
font-size:22px;
line-height:1.8;
max-width:700px;
margin:auto;
}

img{
width:240px;
border-radius:20px;
margin-top:25px;
border:4px solid white;
}

@keyframes glow{
from{
text-shadow:0 0 10px pink;
}
to{
text-shadow:0 0 30px red;
}
}

.heart{
position:absolute;
font-size:25px;
animation:float 5s linear infinite;
}

@keyframes float{
0%{
transform:translateY(100vh);
}
100%{
transform:translateY(-100vh);
}
}

</style>
</head>

<body>

<div class="bg"></div>

<div class="content">

<h1>To My Love ❤️</h1>

<p>
You are the most beautiful part of my life ❤️<br><br>
Every moment with you feels magical ✨<br><br>
No matter what happens,<br>
I will always stay beside you 💖
</p>

<img src="https://i.imgur.com/3ZQ3Z6Q.jpeg">

<h2>I Love You Forever ❤️</h2>

</div>

<script>

function createHeart(){

const heart=document.createElement('div');

heart.classList.add('heart');

heart.innerHTML='❤️';

heart.style.left=Math.random()*100+'vw';

heart.style.top='100vh';

document.body.appendChild(heart);

setTimeout(()=>{
heart.remove();
},5000);

}

setInterval(createHeart,300);

</script>

</body>
</html>
