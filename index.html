<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>
    <style>
        body { background: black; color: white; text-align: center; font-family: Arial; padding-top: 20%; }
        button { padding: 20px; font-size: 20px; border-radius: 10px; cursor: pointer; background: red; color: white; border: none; }
    </style>
</head>
<body>
    <h1>For My Love ❤️</h1>
    
    <audio id="player" controls style="display:none;">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <button onclick="play()">Play Music 🎵</button>

    <script>
        function play() {
            var audio = document.getElementById("player");
            audio.play().then(() => {
                alert("Playing! Audio kekkutha macha?");
            }).catch(e => {
                alert("Error: Song file ah GitHub la check pannu!");
                console.log(e);
            });
        }
    </script>
</body>
</html>
