<!DOCTYPE html>
<html>
<head>
    <title>For My Love ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: black;
            font-family: Arial;
            overflow: hidden;
            color: white;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            background: linear-gradient(45deg, #ff4d4d, #ff9999);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 77, 77, 0.4);
            transition: 0.3s;
        }
        button:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body>

    <h1>For My Love ❤️</h1>

    <audio id="mySong" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <button onclick="playMusic()" id="playBtn">
        Play Music 🎵
    </button>

    <script>
        function playMusic() {
            var audio = document.getElementById("mySong");
            var btn = document.getElementById("playBtn");
            if (audio.paused) {
                audio.play();
                btn.innerHTML = "Pause Music ⏸️";
            } else {
                audio.pause();
                btn.innerHTML = "Play Music 🎵";
            }
        }
    </script>

</body>
</html>
